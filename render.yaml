services:
  - type: web
    name: twilearn
    env: python
    buildCommand: "chmod +x render-build.sh && ./render-build.sh"
    startCommand: "gunicorn twilearn.wsgi:application"
    envVars:
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: twilearn-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: twilearn.onrender.com
      - key: CORS_ALLOW_ALL_ORIGINS
        value: False

databases:
  - name: twilearn-db
    databaseName: twilearn
    user: twilearn_user