services:
  - type: web
    name: twilearn
    env: python
    plan: free
    buildCommand: "python -m pip install --upgrade pip && pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput"
    startCommand: "gunicorn twilearn.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: twilearn-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: twilearn.onrender.com
      - key: CORS_ALLOW_ALL_ORIGINS
        value: False
      - key: PORT
        value: 8000
    healthCheckPath: /

databases:
  - name: twilearn-db
    databaseName: twilearn
    user: twilearn_user